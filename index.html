<!doctype html>
<html lang="uz" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <meta
      name="description"
      content="ChemLab - Virtual Kimyo Laboratoriyasi. Kimyoviy moddalarni virtual muhitda birlashtiring, reaksiyalarni kuzating va natijani tushuning."
    />
    <title>ChemLab — Virtual Kimyo Laboratoriyasi</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%97%EF%B8%8F%3C/text%3E%3C/svg%3E" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <script>
      // Mavzu (dark/light) ni sahifa chizilishidan oldin qo'llash - "flash" bo'lmasligi uchun
      try {
        var saved = localStorage.getItem('chemlab-theme')
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved)
        }
      } catch (e) {
        /* localStorage mavjud emas */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
